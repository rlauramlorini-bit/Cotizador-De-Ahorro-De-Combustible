<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador de Ahorro de Combustible</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      color: #1f2a60;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .resultado {
      background: #e6f4ea;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      font-weight: bold;
      color: #1b5e20;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Cotizador de Ahorro de Combustible</h1>
  <p>Ingresá los datos y calculá el ahorro mensual.</p>

  <div class="card">
    <h2>Precios</h2>

    <label>Precio Diesel surtidor</label>
    <input type="number" id="surtidor" oninput="recalcular()">

    <label>Precio Diesel mayorista</label>
    <input type="number" id="km" oninput="recalcular()">

    <label>Diferencia por litro</label>
    <div class="resultado" id="dif">$ 0</div>
  </div>

  <div class="card">
    <h2>Operación</h2>

    <label>Kilómetros mensuales por camión</label>
    <input type="number" id="km" value="6000">

    <label>Cantidad de camiones</label>
    <input type="number" id="unidades" value="5">

    <label>Consumo mensual por unidad</label>
    <div class="resultado" id="consumoUnidad">0 litros</div>

    <label>Consumo total</label>
    <div class="resultado" id="consumoTotal">0 litros</div>
  </div>

  <div class="card">
    <h2>Ahorro</h2>

    <label>Ahorro mensual</label>
    <div class="resultado" id="ahorro">$ 0</div>

    <label>Opción de tanque</label>
    <select id="tanque">
      <option value="">Seleccionar</option>
      <option value="10000">10.000 litros</option>
      <option value="20000">20.000 litros</option>
      <option value="30000">30.000 litros</option>
    </select>

    <label>Precio del tanque</label>
    <input type="number" id="precioTanque" placeholder="Ej: 36000000">

    <div class="resultado" id="resultadoTanque">—</div>

    <button onclick="calcular()">Calcular ahorro</button>
  </div>
</div>

<script>
function calcular() {
  const surtidor = Number(document.getElementById("surtidor").value);
  const mayorista = Number(document.getElementById("mayorista").value);
  const km = Number(document.getElementById("km").value);
  const unidades = Number(document.getElementById("unidades").value);
  const precioTanque = Number(document.getElementById("precioTanque").value);

  const diferencia = surtidor - mayorista;
  const consumoUnidad = (km / 100) * 45;
  const consumoTotal = consumoUnidad * unidades;
  const ahorro = consumoTotal * diferencia;

  document.getElementById("dif").innerText = "$ " + diferencia.toLocaleString("es-AR");
  document.getElementById("consumoUnidad").innerText = consumoUnidad.toFixed(0) + " litros";
  document.getElementById("consumoTotal").innerText = consumoTotal.toFixed(0) + " litros";
  document.getElementById("ahorro").innerText = "$ " + ahorro.toLocaleString("es-AR");

  if (precioTanque > 0 && ahorro > 0) {
    const meses = precioTanque / ahorro;
    document.getElementById("resultadoTanque").innerText =
      "Con este ahorro cubrís el tanque en " + meses.toFixed(1) + " meses";
  }
}
</script>

</body>
</html>
