<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cotizador de Ahorro de Combustible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1e2a5a;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .section {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .resultado {
      background: #e8f5e9;
      padding: 12px;
      border-radius: 5px;
      margin-top: 8px;
      font-weight: bold;
    }

    .tanque {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h1>Cotizador de Ahorro de Combustible</h1>

<div class="container">

  <!-- PRECIOS -->
  <div class="section">
    <h3>Datos de precios</h3>

    <label>Precio Diesel surtidor</label>
    <input type="number" id="surtidor" oninput="recalcular()">

    <label>Precio Diesel mayorista</label>
    <input type="number" id="mayorista" oninput="recalcular()">

    <label>Diferencia por litro</label>
    <div class="resultado" id="dif">$ 0</div>
  </div>

  <!-- CONSUMO -->
  <div class="section">
    <h3>Consumo</h3>

    <label>Kilómetros mensuales por camión</label>
    <input type="number" id="km" oninput="recalcular()">

    <label>Cantidad de camiones</label>
    <input type="number" id="unidades" oninput="recalcular()">

    <label>Consumo mensual por unidad</label>
    <div class="resultado" id="consumoUnidad">0 litros</div>

    <label>Consumo total</label>
    <div class="resultado" id="consumoTotal">0 litros</div>
  </div>

  <!-- AHORRO -->
  <div class="section">
    <h3>Ahorro</h3>

    <label>Ahorro mensual</label>
    <div class="resultado" id="ahorro">$ 0</div>
  </div>

  <!-- TANQUES -->
  <div class="section">
    <h3>Tanque sugerido</h3>

    <label>Seleccionar opción</label>
    <select id="precioTanque" oninput="recalcular()">
      <option value="">Seleccione una opción</option>
      <option value="36000000">Tanque 10.000 lts – $36.000.000</option>
      <option value="68000000">Tanque 20.000 lts – $68.000.000</option>
      <option value="99000000">Tanque 30.000 lts – $99.000.000</option>
    </select>

    <div class="tanque" id="resultadoTanque">—</div>
  </div>

</div>

<script>
function recalcular() {
  const surtidor = Number(document.getElementById("surtidor").value) || 0;
  const mayorista = Number(document.getElementById("mayorista").value) || 0;
  const km = Number(document.getElementById("km").value) || 0;
  const unidades = Number(document.getElementById("unidades").value) || 0;
  const precioTanque = Number(document.getElementById("precioTanque").value) || 0;

  const diferencia = surtidor - mayorista;
  const consumoUnidad = (km / 100) * 45;
  const consumoTotal = consumoUnidad * unidades;
  const ahorro = consumoTotal * diferencia;

  document.getElementById("dif").innerText =
    "$ " + diferencia.toLocaleString("es-AR");

  document.getElementById("consumoUnidad").innerText =
    consumoUnidad.toFixed(0) + " litros";

  document.getElementById("consumoTotal").innerText =
    consumoTotal.toFixed(0) + " litros";

  document.getElementById("ahorro").innerText =
    "$ " + ahorro.toLocaleString("es-AR");

  if (precioTanque > 0 && ahorro > 0) {
    const meses = precioTanque / ahorro;
    document.getElementById("resultadoTanque").innerText =
      "Con este ahorro cubrís el tanque en " + meses.toFixed(1) + " meses";
  } else {
    document.getElementById("resultadoTanque").innerText = "—";
  }
}
</script>

</body>
</html>
