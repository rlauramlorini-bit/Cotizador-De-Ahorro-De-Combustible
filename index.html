<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cotizador de Ahorro de Combustible</title>
<style>
body {
font-family: Arial, Helvetica, sans-serif;
background: #f4f6fb;
margin: 0;
padding: 0;
}
.container {
max-width: 1100px;
margin: auto;
padding: 30px;
}
h1 {
color: #1f2a60;
font-size: 36px;
}
p {
color: #555;
}
.grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 30px;
margin-top: 20px;
}
.card {
background: #fff;
border-radius: 16px;
padding: 25px;
box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
label {
display: block;
margin-top: 12px;
font-weight: bold;
}
input, select {
width: 100%;
padding: 10px;
margin-top: 5px;
border-radius: 8px;
border: 1px solid #ccc;
font-size: 15px;
}
button {
width: 100%;
margin-top: 20px;
padding: 14px;
background: #0d6efd;
color: white;
border: none;
border-radius: 10px;
font-size: 18px;
cursor: pointer;
}
button:hover {
background: #0b5ed7;
}
.resultado {
background: #e6f4ea;
padding: 15px;
border-radius: 10px;
margin-top: 10px;
font-weight: bold;
color: #1b5e20;
}
@media (max-width: 768px) {
.grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>


<div class="container">
<h1>Cotizador de Ahorro de Combustible</h1>
<p>Ingresá los datos y calculá el ahorro mensual y qué tanque podés cubrir con ese ahorro.</p>


<div class="grid">


<div class="card">
<h2>Datos de precios</h2>


<label>Precio Diesel surtidor</label>
<input type="number" id="surtidor" placeholder="Ej: 950" />


<label>Precio Diesel mayorista</label>
<input type="number" id="mayorista" placeholder="Ej: 820" />


<label>Diferencia por litro</label>
<div class="resultado" id="resultado1">$ 0</div>
